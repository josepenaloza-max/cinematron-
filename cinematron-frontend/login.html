<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematron - Administrador</title>

    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <main id="vista-admin">

        <!-- Login -->
        <form id="form-login" class="box form-box" onsubmit="hacerLogin(event)">
            <h2>Panel de Administrador</h2>

            <div class="campo-login">
                <label for="admin-user">Usuario</label>
                <input type="text" id="admin-user" placeholder="Ingrese su usuario"
                       autocomplete="username" required>
            </div>

            <div class="campo-login">
                <label for="admin-pass">Contraseña</label>
                <input type="password" id="admin-pass" placeholder="Ingrese su contraseña"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-primario">Ingresar</button>
        </form>

        <!-- Panel (oculto hasta iniciar sesión) -->
        <section id="admin-panel" class="box" hidden>
            <h2>Bienvenido Admin</h2>
            <p>Panel de administración de Cinematron.</p>
        </section>

    </main>

    <script src="login.js"></script>
</body>
</html>
