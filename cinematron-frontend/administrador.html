<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematron - Panel de Administración</title>

    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="administrador.css">
</head>

<body>
    <div class="wrap adm">

        <header class="adm-top">
            <b class="logo">CINEMATRON</b>
            <button type="button" id="btn-salir" class="btn-sec">Cerrar sesión</button>
        </header>

        <h1 class="adm-titulo">Panel de Administración</h1>

        <!-- ========== PELÍCULAS ========== -->
        <section class="box adm-sec" aria-labelledby="t-peliculas">
            <h2 id="t-peliculas" class="s">Cartelera</h2>

            <form id="form-pelicula" class="adm-form">
                <div class="campo">
                    <label for="p-titulo">Título</label>
                    <input type="text" id="p-titulo" required maxlength="60">
                </div>
                <div class="campo">
                    <label for="p-genero">Género</label>
                    <input type="text" id="p-genero" required maxlength="30">
                </div>
                <div class="campo">
                    <label for="p-duracion">Duración (min)</label>
                    <input type="number" id="p-duracion" min="1" max="400" required>
                </div>
                <button type="submit" class="btn-primario">Crear película</button>
            </form>

            <ul id="lista-peliculas" class="adm-lista"></ul>
        </section>

        <!-- ========== FUNCIONES ========== -->
        <section class="box adm-sec" aria-labelledby="t-funciones">
            <h2 id="t-funciones" class="s">Funciones</h2>

            <form id="form-funcion" class="adm-form">
                <div class="campo">
                    <label for="f-pelicula">Película</label>
                    <select id="f-pelicula" required></select>
                </div>
                <div class="campo">
                    <label for="f-fecha">Fecha</label>
                    <input type="date" id="f-fecha" required>
                </div>
                <div class="campo">
                    <label for="f-hora">Hora</label>
                    <input type="time" id="f-hora" required>
                </div>
                <button type="submit" class="btn-primario">Crear función</button>
            </form>

            <div class="tabla-scroll">
                <table id="tabla-funciones">
                    <thead>
                        <tr><th>Película</th><th>Fecha</th><th>Hora</th><th>Acción</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- ========== RESERVAS ========== -->
        <section class="box adm-sec" aria-labelledby="t-reservas">
            <h2 id="t-reservas" class="s">Reservas realizadas</h2>

            <div class="tabla-scroll">
                <table id="tabla-reservas">
                    <thead>
                        <tr><th>Código</th><th>Película</th><th>Asientos</th><th>Teléfono</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

    </div>

    <script src="administrador.js"></script>
</body>
</html>
